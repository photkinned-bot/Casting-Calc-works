<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'>
  <defs>
    <radialGradient id='bgGlow' cx='50%' cy='60%' r='65%'>
      <stop offset='0%' stop-color='#2a1f18'/>
      <stop offset='60%' stop-color='#161d2b'/>
      <stop offset='100%' stop-color='#0b0f19'/>
    </radialGradient>
    <linearGradient id='borderGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#d97706' stop-opacity='0.6'/>
      <stop offset='50%' stop-color='#f59e0b' stop-opacity='0.2'/>
      <stop offset='100%' stop-color='#78350f' stop-opacity='0.4'/>
    </linearGradient>
    <linearGradient id='outerFlame' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#b91c1c'/>
      <stop offset='30%' stop-color='#ea580c'/>
      <stop offset='70%' stop-color='#f59e0b'/>
      <stop offset='100%' stop-color='#fbbf24'/>
    </linearGradient>
    <linearGradient id='midFlame' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#ea580c'/>
      <stop offset='45%' stop-color='#f59e0b'/>
      <stop offset='85%' stop-color='#fde047'/>
      <stop offset='100%' stop-color='#ffffff'/>
    </linearGradient>
    <linearGradient id='coreFlame' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#f59e0b'/>
      <stop offset='50%' stop-color='#fef08a'/>
      <stop offset='100%' stop-color='#ffffff'/>
    </linearGradient>
    <linearGradient id='crucibleGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#475569'/>
      <stop offset='50%' stop-color='#334155'/>
      <stop offset='100%' stop-color='#1e293b'/>
    </linearGradient>
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='12' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
    <filter id='strongGlow' x='-30%' y='-30%' width='160%' height='160%'>
      <feGaussianBlur stdDeviation='20' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>

  <!-- Background base rounded square for iOS -->
  <rect width='512' height='512' rx='115' fill='url(#bgGlow)'/>
  <rect x='4' y='4' width='504' height='504' rx='111' fill='none' stroke='url(#borderGrad)' stroke-width='4'/>

  <!-- Subtle glow beneath flame -->
  <circle cx='256' cy='320' r='140' fill='#f59e0b' opacity='0.22' filter='url(#strongGlow)'/>

  <!-- Main Casting Flame Group -->
  <g filter='url(#glow)'>
    <!-- Outer primary flame -->
    <path d='M256,64 C280,140 376,190 376,300 C376,380 320,424 256,424 C192,424 136,380 136,300 C136,210 208,160 224,110 C234,160 260,195 272,215 C282,175 270,120 256,64 Z' fill='url(#outerFlame)'/>

    <!-- Middle vibrant flame layer -->
    <path d='M256,150 C274,200 340,240 340,315 C340,375 298,408 256,408 C214,408 172,375 172,315 C172,245 220,205 234,175 C242,210 262,235 270,245 C275,210 266,180 256,150 Z' fill='url(#midFlame)' opacity='0.95'/>

    <!-- Inner core intense heat flame -->
    <path d='M256,230 C268,265 304,290 304,335 C304,375 278,394 256,394 C234,394 208,375 208,335 C208,290 236,265 244,245 C248,265 258,280 262,285 C264,265 260,245 256,230 Z' fill='url(#coreFlame)'/>
  </g>

  <!-- Golden casting spark embers -->
  <circle cx='180' cy='180' r='6' fill='#fde047' opacity='0.8' filter='url(#glow)'/>
  <circle cx='335' cy='190' r='8' fill='#f59e0b' opacity='0.85' filter='url(#glow)'/>
  <circle cx='310' cy='130' r='5' fill='#fef08a' opacity='0.9' filter='url(#glow)'/>
  <circle cx='200' cy='120' r='4' fill='#f59e0b' opacity='0.75'/>
  <circle cx='256' cy='45' r='5' fill='#ffffff' opacity='0.9' filter='url(#glow)'/>
</svg>